name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: ./mvnw clean verify -DskipTests

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Deploy auth-service to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd /opt/alfa-hospital
            git -C alfa-auth-service pull
            git -C alfa-docker pull
            docker compose -f alfa-docker/docker-compose.prod.yml rm -sf auth-service || true
            docker container prune -f || true
            docker compose -f alfa-docker/docker-compose.prod.yml up -d --build --no-deps auth-service
